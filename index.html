<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>每日任务 · 印冬建工作平台</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<style>
  :root{
    --blue:#2563eb; --blue-d:#1d4ed8; --green:#16a34a; --red:#dc2626;
    --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    font-size:16px;
  }
  /* 顶部栏 */
  .topbar{
    background:linear-gradient(135deg,var(--blue),var(--blue-d));
    color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar .date-label{font-size:15px;opacity:.95;line-height:1.3;}
  .topbar .date-label b{font-size:19px;font-weight:700;display:block;}
  .progress{display:flex;align-items:center;gap:8px;}
  .progress svg{flex:none;}
  .progress .ptext{font-size:13px;font-weight:600;min-width:42px;text-align:right;}
  /* 主体 */
  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 18px;}
  .view{display:none;} .view.active{display:block;}
  /* 添加卡片 */
  .add-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px;}
  .add-card input[type=text],.add-card input[type=date],.add-card select,.add-card textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    font-size:16px;color:var(--text);background:#fff;font-family:inherit;
  }
  .add-card input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  .add-row{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .add-row > *{flex:1;min-width:0;margin-top:0 !important;}
  .add-row .pri-select{flex:1;min-width:0;text-align:center;padding-left:2px;padding-right:2px;}
  .btn{
    border:none;border-radius:10px;padding:12px;font-size:16px;font-weight:600;
    cursor:pointer;font-family:inherit;width:100%;margin-top:10px;
  }
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.primary:active{background:var(--blue-d);}
  .btn.ghost{background:#eef2ff;color:var(--blue);}
  .btn.excel{background:#e7f6ec;color:var(--green);}
  .btn.danger{background:#fef2f2;color:var(--red);}
  /* 常用任务选项 - 6大类两列布局 */
  .presets-label{font-size:13px;color:var(--sub);font-weight:600;margin:2px 2px 8px;}
  .preset-categories{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
  .preset-pair{margin-bottom:10px;}
  .preset-names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .preset-cat-name{font-size:12.5px;font-weight:700;color:var(--blue);text-align:left;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
  .preset-selects{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .preset-select{width:auto;min-width:110px;max-width:100%;justify-self:center;border:1px solid var(--line);border-radius:10px;padding:7px 10px;
    font-size:14px;color:var(--text);background:#fff;font-family:inherit;appearance:auto;-webkit-appearance:listbox;
    min-height:40px;}
  .preset-select:focus{outline:none;border-color:var(--blue);}
  /* 已选任务chips */
  .presets-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;min-height:28px;}
  .presets-chips .chip{text-align:center;border:1px solid var(--line);background:#f8fafc;color:var(--text);
    border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer;user-select:none;transition:.15s;line-height:1.2;
    display:inline-flex;align-items:center;gap:4px;}
  .presets-chips .chip:active{transform:scale(.96);}
  .presets-chips .chip.sel{background:var(--blue);color:#fff;border-color:var(--blue);
    box-shadow:0 2px 6px rgba(37,99,235,.35);}
  .presets-chips .chip.sel::after{content:" ×";font-size:11px;font-weight:700;margin-left:2px;}
  .or-line{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12px;margin:12px 0;}
  .or-line::before,.or-line::after{content:"";flex:1;height:1px;background:var(--line);}
  /* 区块标题 */
  .sec-title{font-size:13px;color:var(--sub);font-weight:600;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center;}
  /* 任务列表 */
  .task{background:#dbeafe;border:1px solid #bcd6fb;border-left:4px solid var(--blue);border-radius:14px;padding:13px 14px;
    box-shadow:0 2px 10px rgba(37,99,235,.18);
    display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative;}
  #todayList{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  #todayList .task{margin-bottom:0;}
  .task.done{background:#eef4ff;border-color:#d6e3fb;border-left-color:#c2d4f7;}
  #todayList .empty{grid-column:1/-1;}
  .task .check{
    flex:none;width:14px;height:14px;border-radius:50%;border:2px solid #cbd5e1;
    background:#fff;cursor:pointer;position:relative;transition:.15s;
  }
  .task.done .check{background:var(--green);border-color:var(--green);}
  .task.done .check::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:7px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .task .main{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;justify-content:center;}
  .task .title-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
  .task .title{font-size:14px;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .task.done .title{color:var(--sub);text-decoration:line-through;}
  .tag{font-size:12px;color:#fff;padding:2px 9px;border-radius:20px;font-weight:500;}
  .pri{font-size:9.5px;font-weight:600;padding:1px 5px;border-radius:6px;}
  .pri.high{background:#fef2f2;color:var(--red);}
  .pri.normal{background:#eff6ff;color:var(--blue);}
  .pri.low{background:#dcfce7;color:var(--green);}
  .note-flag{font-size:12px;color:var(--sub);background:#f8fafc;border:1px solid var(--line);padding:1px 7px;border-radius:6px;}
  .note-text{font-size:12px;color:var(--sub);background:#f8fafc;border:1px solid var(--line);padding:3px 8px;border-radius:6px;max-width:100%;line-height:1.5;text-align:center;
    white-space:normal;word-break:break-word;overflow-wrap:anywhere;text-wrap:balance;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  .add-card .note-input{margin-top:0;}
  .add-card select{margin-top:0;}
  .add-row input[type="time"]{flex:1;min-width:0;}
  .remind-chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);white-space:nowrap;flex:1;justify-content:center;}
  .remind-chk input[type="checkbox"]{width:22px;height:22px;flex:none;accent-color:var(--primary);cursor:pointer;}
  .field.remind-field label{margin-bottom:6px;display:block;}
  .remind-inline{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap;}
  .remind-inline input[type="time"]{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;}
  .bell{font-size:12px;margin-left:4px;}
  .ics-btn{flex:none;border:none;background:transparent;font-size:15px;cursor:pointer;padding:0 2px;line-height:1;align-self:center;}
  .ics-btn:active{opacity:0.6;}
  .task .del{flex:none;border:none;background:transparent;color:#cbd5e1;font-size:22px;line-height:1;
    cursor:pointer;padding:0 4px;align-self:center;}
  .task .del:active{color:var(--red);}
  .empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:15px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);}
  /* 日历 */
  .cal-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head .m{font-size:17px;font-weight:700;}
  .cal-head button{border:none;background:#f1f5f9;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--text);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-grid .wd{text-align:center;font-size:12px;color:var(--sub);padding:5px 0 3px;font-weight:600;}
  .cal-cell{min-height:84px;border-radius:8px;display:flex;flex-direction:column;align-items:stretch;
    font-size:14px;cursor:pointer;position:relative;background:#f8fafc;padding:2px 2px 4px;gap:0;overflow:hidden;}
  .cal-cell.today{background:#f8fafc;}
  .cal-cell.other{background:#f8fafc;}
  .cal-cell .cd{font-size:12px;line-height:1.4;padding:1px 2px 0;font-weight:700;color:var(--text);align-self:center;width:100%;text-align:center;}
  .cal-cell.today .cd{color:var(--blue-d);font-weight:800;}
  .cal-cell.other .cd{color:#cbd5e1;font-weight:600;}
  /* 农历：位于日期正下方，浅灰色、黑体 */
  .cal-cell .cd-lunar{font-size:9px;line-height:1.2;color:#c2c2c2;font-weight:700;font-family:"SimHei","Heiti SC","Microsoft YaHei",sans-serif;align-self:center;width:100%;text-align:center;letter-spacing:0.5px;}
  /* 日历内的任务标签 - 等长等宽直角矩形，背景色表示状态，垂直+水平居中，统一行距 */
  .cal-cell .ct{display:flex;align-items:center;justify-content:center;gap:0;font-size:8px;line-height:1;
    border-radius:0;padding:0 2px;cursor:pointer;flex:none;width:100%;height:16px;margin:0 0 2px 0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1e3a5f;font-weight:500;
    border:none;box-sizing:border-box;}
  .cal-cell .ct .ct-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit;font-size:inherit;line-height:1;}
  /* 状态背景色：浅绿=完成 / 浅蓝=进行中 / 浅红=逾期 */
  .cal-cell .ct.done{background:#bbf7d0;color:#166534;}
  .cal-cell .ct.overdue{background:#fecaca;color:#991b1b;font-weight:600;}
  .cal-cell .ct:not(.done):not(.overdue){background:#dbeafe;color:#1e40af;}
  /* 重要(high)：文字红色 + 加粗 */
  .cal-cell .ct.imp,.cal-cell .ct.imp .ct-t{color:#f87171;font-weight:800;}
  /* 稍后(low)：颜色变浅（更浅一档，与底色匹配，不改背景） */
  .cal-cell .ct.done.low{color:#15803d;}
  .cal-cell .ct.overdue.low{color:#b91c1c;}
  .cal-cell .ct:not(.done):not(.overdue).low{color:#6b9bd6;}
  .cal-cell .cm{font-size:9px;color:var(--sub);padding:0 4px;}
  /* 日历专项达标图标 */
  .cal-spec-icons{display:flex;gap:2px;justify-content:center;align-items:center;padding:0 0 1px;}
  .csi{font-size:10px;line-height:1;flex:none;display:inline-block;width:14px;text-align:center;}
  /* 专项统计 */
  .spec-head{display:flex;gap:8px;align-items:center;margin-bottom:4px;}
  .spec-head input[type=date]{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff;font-family:inherit;}
  .spec-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .spec-entry-row{display:flex;align-items:center;gap:8px;margin-top:14px;padding:12px 14px;background:#fff;border-radius:12px;box-shadow:var(--shadow);}
  .spec-date-sport{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .spec-date-sport>*{flex:1;min-width:0;}
  .spec-date-sport .spec-entry-row{margin-top:0;}
  .spec-date-wrap input[type=date]{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff;font-family:inherit;}
  .spec-entry-name{flex:none;font-size:16px;font-weight:700;min-width:44px;}
  .spec-sub-label{flex:none;font-size:14px;color:var(--sub);}
  .spec-dot{width:12px;height:12px;border-radius:50%;flex:none;}
  .spec-name{flex:none;width:54px;font-size:15px;font-weight:600;}
  .spec-val{flex:1;min-width:64px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff;font-family:inherit;}
  .spec-val:focus{outline:none;border-color:var(--blue);}
  .spec-unit{flex:none;width:42px;font-size:13px;color:var(--sub);text-align:left;}
  .spec-clr{flex:none;border:none;background:#fef2f2;color:var(--red);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;}
  .spec-clr-ph{flex:none;width:38px;}
  .sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
  .sc-box{background:#fff;border:1.5px solid; border-radius:14px;padding:14px;box-shadow:var(--shadow);}
  .sc-box .n{font-size:26px;font-weight:800;line-height:1;}
  .sc-box .l{font-size:12px;color:var(--sub);margin-top:6px;}
  .sc-sub{font-size:13px;color:var(--text);margin-top:6px;}
  .sc-met{font-size:12px;margin-top:6px;font-weight:700;}
  .spec-trend-row{display:flex;align-items:flex-start;gap:8px;margin-top:6px;}
  .st-name{flex:none;width:48px;font-size:13px;color:var(--text);font-weight:600;padding-top:6px;}
  .st-legend{flex:none;width:70px;font-size:10px;padding-top:4px;text-align:left;line-height:1.6;white-space:normal;word-break:break-all;}
  .sbars{flex:1;display:flex;align-items:flex-end;gap:6px;height:46px;}
  .sb{flex:1;border-radius:3px 3px 0 0;min-height:3px;}
  .sb.zero{background:#e2e8f0 !important;}
  .spec-stat-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;}
  .ss-name{flex:none;width:48px;font-weight:600;}
  .ss-val{flex:1;color:var(--sub);min-width:0;line-height:1.6;}
  .ss-val b{color:var(--text);font-size:15px;}
  .sm-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .sm-row .spec-dot{margin-right:2px;}
  .sm-name{flex:2;min-width:0;border:none;background:transparent;padding:8px 4px;font-size:15px;font-weight:600;font-family:inherit;}
  .sm-unit{flex:1;min-width:0;border:none;background:transparent;padding:8px 4px;font-size:15px;color:var(--sub);font-family:inherit;}
  .sm-color{flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:2px;cursor:pointer;}
  .sm-del{flex:none;border:none;background:#fef2f2;color:var(--red);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;cursor:pointer;}
  .sm-add{display:flex;align-items:center;gap:8px;margin-top:16px;}
  .sm-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;background:#fff;font-family:inherit;}
  .sm-target{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:#fff;font-family:inherit;}
  /* 折叠类别 */
  .preset-acc{display:flex;flex-direction:column;gap:8px;margin-bottom:4px;}
  .preset-details{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;}
  .preset-summary{padding:12px 16px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;cursor:pointer;list-style:none;user-select:none;display:flex;justify-content:space-between;align-items:center;
    transition:.15s;}
  .preset-summary::-webkit-details-marker{display:none;}
  .preset-summary::after{content:"▼";font-size:11px;transition:transform.2s;}
  .preset-details[open] .preset-summary::after{transform:rotate(180deg);}
  .preset-details[open] .preset-summary{border-radius:12px 12px 0 0;}
  /* 专项汇总 - 自适应网格：3项→1行3列 / 4项→2行2列 / 5项→第一行3+第二行2 / 6项→2行3列 */
  .sc-grid-auto{display:grid;gap:10px;margin-top:10px;}
  .sc-grid-auto.cols-3{grid-template-columns:repeat(3,1fr);}
  .sc-grid-auto.cols-4{grid-template-columns:repeat(2,1fr);}
  .sc-grid-auto.cols-5{grid-template-columns:repeat(3,1fr);}
  .sc-grid-auto.cols-5 .sc-box:first-child{grid-column:1/-1;}
  .sc-grid-auto.cols-6{grid-template-columns:repeat(3,1fr);}
  /* 折线图（替代柱状图） */
  .line-chart{position:relative;width:100%;height:110px;margin-top:2px;border-left:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;}
  .line-chart svg{width:100%;height:100%;overflow:visible;}
  .line-chart .lc-dot{r:3;stroke:#fff;stroke-width:1.5;}
  .line-chart .lc-label{text-anchor:middle;font-size:9px;fill:var(--sub);}
  .line-chart .lc-target{stroke:#dc2626;stroke-dasharray:4,3;stroke-width:1;fill:none;}
  /* 统计 */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .stat-box{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);}
  .stat-box .n{font-size:28px;font-weight:800;line-height:1;}
  .stat-box .l{font-size:13px;color:var(--sub);margin-top:6px;}
  .stat-box.blue .n{color:var(--blue);} .stat-box.green .n{color:var(--green);}
  .stat-box.orange .n{color:#ea580c;} .stat-box.purple .n{color:#7c3aed;}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:15px;}
  .trend{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:120px;}
  .trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
  .trend .bar{width:100%;max-width:26px;background:var(--blue);border-radius:6px 6px 0 0;min-height:3px;transition:.3s;}
  .trend .bar.zero{background:#e2e8f0;}
  .trend .d{font-size:11px;color:var(--sub);}
  .trend .v{font-size:11px;font-weight:700;color:var(--text);}
  /* 统计-7天趋势复式图（条形=任务数，折线=完成数） */
  .combo-svg{width:100%;height:auto;display:block;margin-top:4px;}
  .combo-legend{display:flex;gap:18px;font-size:12px;color:var(--sub);margin-bottom:4px;}
  .combo-legend span{display:inline-flex;align-items:center;gap:5px;}
  .combo-legend .cl-bar i{width:14px;height:9px;background:#93c5fd;border-radius:2px;display:inline-block;}
  .combo-legend .cl-line i{width:16px;height:0;border-top:2px solid #ea580c;display:inline-block;}
  .dist-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:14px;}
  .dist-row .name{width:74px;flex:none;color:var(--text);}
  .dist-row .track{flex:1;background:#f1f5f9;border-radius:20px;height:14px;overflow:hidden;}
  .dist-row .fill{height:100%;border-radius:20px;}
  .dist-row .cnt{width:34px;flex:none;text-align:right;color:var(--sub);font-size:13px;}
  /* 统计-近期任务列表（今天 / 明天 / 后天） */
  .recent-day{margin-bottom:14px;}
  .recent-day:last-child{margin-bottom:0;}
  .recent-date{font-size:13px;font-weight:700;color:var(--blue);margin:2px 2px 8px;}
  .rtable{width:100%;border-collapse:collapse;font-size:12px;}
  .rtable th{font-size:11px;color:var(--sub);font-weight:600;text-align:left;padding:4px 5px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .rtable td{padding:7px 5px;border-bottom:1px solid #f1f5f9;vertical-align:middle;color:var(--text);}
  .rtable tr:last-child td{border-bottom:none;}
  .rtable .rt-title{font-weight:600;}
  .rtable .rt-cell{color:var(--sub);white-space:nowrap;}
  .rtable .rt-cell:nth-child(2),.rtable .rt-cell:nth-child(3){max-width:80px;overflow:hidden;text-overflow:ellipsis;}
  .rt-pri{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;}
  .rt-pri.rt-hi{color:var(--red);background:#fef2f2;}
  .rt-pri.rt-no{color:#475569;background:#f1f5f9;}
  .rt-pri.rt-lo{color:#2563eb;background:#eff6ff;}
  .rt-done-ok{color:var(--green);font-weight:800;font-size:15px;}
  .rt-done-no{color:#cbd5e1;font-weight:800;font-size:15px;}

  .pie-wrap{display:flex;justify-content:center;margin:4px 0 10px;}
  .pie-svg{width:200px;height:200px;}
  .pie-svg g:hover{opacity:.85;}
  .pie-detail{font-size:14px;color:var(--text);text-align:center;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;padding:9px;margin-bottom:10px;}
  .pie-detail.tip{color:var(--sub);}
  .pie-legend{display:flex;flex-direction:column;gap:2px;}
  .pie-legend-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;}
  .pie-legend-row .pl-dot{width:12px;height:12px;border-radius:3px;flex:none;}
  .pie-legend-row .pl-name{flex:1;color:var(--text);}
  .pie-legend-row .pl-cnt{flex:none;color:var(--sub);font-variant-numeric:tabular-nums;}
  /* 设置 */
  .set-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;}
  .set-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .set-item:last-child{border-bottom:none;}
  .set-item .sw{width:14px;height:14px;border-radius:4px;flex:none;}
  .set-item .nm{flex:1;font-size:15px;}
  .set-item button{border:none;background:#fef2f2;color:var(--red);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;}
  .cat-add{display:flex;gap:8px;margin:12px 0;}
  .cat-add input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;}
  .cat-add button{border:none;background:var(--blue);color:#fff;border-radius:10px;padding:0 16px;font-size:15px;font-weight:600;}
  .tip{font-size:13px;color:var(--sub);line-height:1.6;padding:4px 4px 0;}
  /* 底部导航 */
  nav.tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);}
  nav.tabbar button{flex:1;border:none;background:transparent;padding:9px 0 7px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);font-size:11px;font-family:inherit;}
  nav.tabbar button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  nav.tabbar button.active{color:var(--blue);}
  /* 遮罩弹层 */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;flex-direction:column;
    justify-content:flex-end;z-index:50;}
  .overlay.hidden{display:none;}
  .sheet{background:#fff;border-radius:20px 20px 0 0;max-height:88dvh;overflow-y:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);}
  .act-title{font-size:14px;font-weight:600;margin:6px 0 14px;color:var(--text);text-align:center;line-height:1.4;}
  .sheet h2{margin:0 0 14px;font-size:18px;display:flex;justify-content:center;align-items:center;position:relative;}
  .sheet h2 span{flex:1;text-align:center;}
  .sheet h2 .close{border:none;background:#f1f5f9;border-radius:50%;width:30px;height:30px;font-size:18px;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;position:absolute;right:0;top:50%;transform:translateY(-50%);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff;}
  .field textarea{resize:vertical;min-height:70px;}
  /* 编辑任务：8 行均匀横向布局（标签行 + 选填框行成对） */
  .ef-row{display:flex;gap:10px;margin-top:4px;}
  .ef-row.ef-in{margin-top:0;margin-bottom:14px;}
  .ef-row>label{flex:1;min-width:0;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:5px;display:block;}
  .ef-in>input,.ef-in>select,.ef-in>textarea{flex:1;min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff;box-sizing:border-box;}
  .ef-in>textarea{resize:vertical;min-height:70px;}
  /* 编辑任务：备注 / 提醒 等宽 */
  .ef-remind{flex:1;min-width:0;width:100%;display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap;}
  .ef-remind input[type="time"]{flex:1;min-width:110px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff;box-sizing:border-box;}
  /* 灵敏度：高灵敏度时消除点击延迟、弹窗跟随手指 */
  body.fast button,body.fast [data-action],body.fast .cal-cell,body.fast .ct,body.fast .day-task,body.fast .sheet .close,body.fast .preset-select,body.fast input,body.fast select,body.fast textarea{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  /* 任务操作弹层（跟随点击位置） */
  .overlay.popover{background:rgba(15,23,42,.18);justify-content:flex-start;align-items:flex-start;}
  .overlay.popover .sheet{position:fixed;width:240px;max-width:82vw;border-radius:20px;box-shadow:0 12px 34px rgba(15,23,42,.28);animation:popIn .12s ease-out;}
  @keyframes popIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  .ef-remind{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ef-remind input[type="time"]{border:none;padding:2px 4px;font-size:15px;background:transparent;}
  /* 访问口令：锁屏与二维码 */
  .lock-card,.qr-card{margin:auto;background:#fff;border-radius:16px;padding:22px 20px;width:min(360px,86vw);
    box-shadow:0 12px 40px rgba(15,23,42,.35);text-align:center;position:relative;}
  .lock-title{font-size:18px;font-weight:700;margin-bottom:14px;color:var(--text);}
  .lock-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;margin-bottom:10px;text-align:center;font-family:inherit;}
  .lock-err{color:#dc2626;font-size:13px;min-height:16px;margin-bottom:8px;}
  .qr-card .close{position:absolute;right:10px;top:10px;border:none;background:#f1f5f9;border-radius:50%;width:30px;height:30px;font-size:18px;color:var(--sub);cursor:pointer;}
  .qr-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text);}
  .qr-card canvas{display:block;margin:0 auto 12px;border:1px solid var(--line);border-radius:8px;}
  .qr-pw{font-size:15px;color:var(--text);margin-bottom:10px;word-break:break-all;}
  .qr-pw b{color:var(--blue);}
  .day-task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .day-task:last-child{border-bottom:none;}
  .day-task .check{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;flex:none;cursor:pointer;position:relative;}
  .day-task.done .check{background:var(--green);border-color:var(--green);}
  .day-task.done .check::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .day-task .t{flex:1;font-size:15px;}
  .day-task.done .t{color:var(--sub);text-decoration:line-through;}
  .day-adjust-wrap{margin-top:18px;display:flex;justify-content:flex-end;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(15,23,42,.9);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .sync-status{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5;}
  .sync-status.ok{color:var(--green);}
  .sync-status.err{color:var(--red);}
  .auto-toggle{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;border:none;cursor:pointer;}
  .icloud-note{font-size:13px;color:var(--sub);line-height:1.6;padding:4px 4px 0;}
  .steps{margin:8px 0 0;padding-left:18px;}
  .steps li{margin:5px 0;line-height:1.5;font-size:13.5px;color:var(--text);}
  .steps li b{color:var(--blue-d);}

    /**

     * @param {number} y - lunar Year
     * @returns {number}
     * @eg:var count = solarLunar.lYearDays(1987) ;//count=387
     */
    lYearDays(y) {
      let sum = 348;
      const info = lunarInfo[y - 1900];
      // 优化：直接计算位数，减少循环
      sum += info & 0x8000 ? 1 : 0;
      sum += info & 0x4000 ? 1 : 0;
      sum += info & 0x2000 ? 1 : 0;
      sum += info & 0x1000 ? 1 : 0;
      sum += info & 0x0800 ? 1 : 0;
      sum += info & 0x0400 ? 1 : 0;
      sum += info & 0x0200 ? 1 : 0;
      sum += info & 0x0100 ? 1 : 0;
      sum += info & 0x0080 ? 1 : 0;
      sum += info & 0x0040 ? 1 : 0;
      sum += info & 0x0020 ? 1 : 0;
      sum += info & 0x0010 ? 1 : 0;
      return sum + solarLunar.leapDays(y);
    },

    /**
     * 返回农历y年闰月是哪个月；若y年没有闰月 则返回0
     * @param {number} y - lunar Year

    leapMonth(y) {

      return lunarInfo[y - 1900] & 0xf;

    /**

     * @eg:var leapMonthDay = solarLunar.leapDays(1987) ;//leapMonthDay=29
     */
    leapDays(y) {
      if (solarLunar.leapMonth(y)) {
        return lunarInfo[y - 1900] & 0x10000 ? 30 : 29;
      }
      return 0;
    },

    /**
     * 返回农历 y 年 m 月（非闰月）的总天数，计算 m 为闰月时的天数请使用 leapDays 方法
     * @param {number} y - lunar Year
     * @param {number} m - lunar Month
     * @returns {number} (-1、29、30)
     * @eg:var MonthDay = solarLunar.monthDays(1987,9) ;//MonthDay=29
     */
    monthDays(y, m) {
      if (m > 12 || m < 1) {
        return -1;
      } //月份参数从1至12，参数错误返回-1
      return lunarInfo[y - 1900] & (0x10000 >> m) ? 30 : 29;
    },

     * @eg:var shichen = solarLunar.getShiChen(23, 0); // 23:00 的子时，日干为甲时
     */
    getShiChen(h, dayGanIndex) {
      const hourZhiIndex = (h + 1) / 2 >= 24 ? 0 : Math.floor((h + 1) / 2) % 12;
      const hourGanIndex = (dayGanIndex * 2 + hourZhiIndex) % 10;
      return gan[hourGanIndex] + zhi[hourZhiIndex];
    },

     */
    solarDays(y, m) {
      if (m > 12 || m < 1) {
        return -1;
      } //若参数错误 返回-1
      const ms = m - 1;
      if (ms === 1) {
        //2月份的闰平规律测算后确认返回28或29
        return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 29 : 28;
      } else {
        return solarMonth[ms];
      }
    },

        _info[5].substr(1, 2),

      ];
      return parseInt(_calDay[n - 1]);
    },

/* ---------- 工具 ---------- */
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

function parseDate(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- 任务操作 ---------- */
function addTask(title,date,cat,pri,note,extra){
  title=title.trim();if(!title){toast("请输入任务内容");return false;}
  date=date||todayStr();
  if(state.tasks.some(t=>t.date===date&&t.title.trim().toLowerCase()===title.toLowerCase()))return false;
  const ex=extra||{};
  state.tasks.push({
    id:uid(),title,date,
    category:cat||"其他",
    priority:pri||"normal",
    note:(note||"").trim(),
    period:(ex.period||"").trim(),
    arrange:(ex.arrange||"").trim(),
    place:(ex.place||"").trim(),
    remind:!!ex.remind,
    remindTime:ex.remindTime||"",
    done:false,doneAt:null,createdAt:Date.now()
  });
  save();return true;
}
// 连续日期：在 [start,end] 每天生成一条任务（共享 group，便于识别为同一连续任务）
function addRange(title,start,end,cat,pri,note,extra){
  let n=0;const s=parseDate(start),e0=parseDate(end);
  let e=new Date(e0);if(e<s)e=new Date(s);
  let cur=new Date(s);
  while(cur<=e){if(addTask(title,fmt(cur),cat,pri,note,extra))n++;cur.setDate(cur.getDate()+1);}
  return n;
}

/* ---------- 提醒引擎（通知 + 响铃 + 震动） ---------- */
let _remTimers=[];
let _audioCtx=null;
function ensureAudio(){
  if(_audioCtx)return _audioCtx;
  try{_audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){_audioCtx=null;}
  return _audioCtx;
}
function playAlarm(){
  const ctx=ensureAudio();if(!ctx)return;
  if(ctx.state==="suspended"){try{ctx.resume();}catch(e){}}
  const now=ctx.currentTime;
  for(let i=0;i<3;i++){
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type="square";o.frequency.value=880;
    const s=now+i*0.5;
    g.gain.setValueAtTime(0.0001,s);
    g.gain.exponentialRampToValueAtTime(0.35,s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,s+0.38);
    o.connect(g);g.connect(ctx.destination);
    o.start(s);o.stop(s+0.4);
  }
}
function requestNotifPermission(){
  try{if("Notification" in window&&Notification.permission==="default"){Notification.requestPermission().catch(()=>{});}}catch(e){}
}
function fireReminder(t){
  let body=(t.period&&t.period!=="全天"?("["+t.period+"] "):"")+t.title;
  if(t.arrange)body+=" · "+t.arrange;
  if(t.place)body+=" @ "+t.place;
  try{
    if("Notification" in window&&Notification.permission==="granted"){
      const n=new Notification("⏰ 任务提醒",{body:body,tag:"rem-"+t.id,requireInteraction:true});
      n.onclick=()=>{try{window.focus();}catch(e){}n.close();};
    }
  }catch(e){}
  playAlarm();
  if(navigator.vibrate){try{navigator.vibrate([400,200,400,200,400]);}catch(e){}}
  toast("⏰ 提醒："+t.title);
}
function armReminders(){
  _remTimers.forEach(id=>{try{clearTimeout(id);}catch(e){}});_remTimers=[];
  const now=Date.now();
  state.tasks.forEach(t=>{
    if(!t.remind||!t.remindTime||t.done)return;
    const tm=new Date(t.date+"T"+t.remindTime).getTime();
    if(isNaN(tm)||tm<=now)return;
    _remTimers.push(setTimeout(()=>fireReminder(t),tm-now));
  });
}

/* ---------- .ics 日历告警（导入手机日历后关应用也响） ---------- */
function generateICS(t){
  // 根据任务时段估算起止时间
  const timeStr=t.remindTime||"09:00";
  const periodMap={"上午":"0800","下午":"1400","晚上":"1900","全天":"0900"};
  const startHM=periodMap[t.period]||timeStr.replace(":","");
  let endH=parseInt(startHM.substr(0,2)),endM=parseInt(startHM.substr(2,2));
  endM+=60;endH+=Math.floor(endM/60);endM=endM%60;
  const endHM=String(endH).padStart(2,"0")+String(endM).padStart(2,"0");
  const d=t.date.replace(/-/g,"");
  const dtstart=d+"T"+startHM;
  const dtend=d+"T"+endHM;
  let desc="";
  if(t.period&&t.period!=="全天")desc="时段："+t.period+"\n";
  if(t.arrange)desc+="安排："+t.arrange+"\n";
  if(t.place)desc+="地点："+t.place+"\n";
  if(t.note)desc+="备注："+t.note;
  const summary=(t.period&&t.period!=="全天"?"["+t.period+"] ":"")+t.title;
  // RFC5545 行折叠（最长75字节）
  function fold(s){const r=[];let line="";for(const ch of s){line+=ch;if(encodeURI(line).length>72){r.push(line);line=" ";}}if(line)r.push(line);return r.join("\r\n ");}
  const ics=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//TaskTracker//ZHCN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    "DTSTART;VALUE=DATE-TIME:"+dtstart,
    "DTEND;VALUE=DATE-TIME:"+dtend,
    fold("SUMMARY:"+summary),
    fold("DESCRIPTION:"+desc.replace(/\n/g,"\\n")),
    "UID:task-"+t.id+"@tasktracker.local",
    "STATUS:CONFIRMED",
    "BEGIN:VALARM",
    "ACTION:AUDIO",
    "TRIGGER:-PT0M",
    "REPEAT:1",
    "DURATION:PT1M",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");
  // 触发下载
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=(t.title||"提醒")+".ics";
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},500);
  toast("📅 已生成日历文件，请用「系统日历」打开");
}

function toggleTask(id){
  const t=state.tasks.find(t=>t.id===id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?Date.now():null;save();
}
function delTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);save();}
function sortTasks(list){
  const order={high:0,normal:1,low:2};
  return list.slice().sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    if(!a.done){if(order[a.priority]!==order[b.priority])return order[a.priority]-order[b.priority];return a.createdAt-b.createdAt;}
    return (b.doneAt||0)-(a.doneAt||0);
  });
}
function priLabel(p){return p==="high"?"重要":p==="low"?"稍后":"普通";}

/* ---------- 日历视图（含连续任务跨天可视化） ---------- */

/* 辅助：日期字符串的下一天 */
function nextDateStr(ds){
  const p=ds.split("-").map(Number);
  const d=new Date(p[0],p[1]-1,p[2]+1);
  return fmt(d);
}

/* 将全部任务识别为"连续块"：同标题+日期连续 → 归为一组（全局，跨月也连续） */
function buildCalBlocks(){
  const groups={};
  state.tasks.forEach(t=>{
    if(!groups[t.title])groups[t.title]=[];
    groups[t.title].push(t);
  });
  const blocks=[];
  Object.keys(groups).sort().forEach(title=>{
    const arr=groups[title].sort((a,b)=>a.date.localeCompare(b.date));
    let cur=null;
    arr.forEach(t=>{
      if(!cur){cur={title,titleIds:[t.id],dates:[t.date],tasks:[t]};}
      else{
        const last=cur.dates[cur.dates.length-1];
        if(t.date===nextDateStr(last)){cur.dates.push(t.date);cur.tasks.push(t);cur.titleIds.push(t.id);}
        else{blocks.push(cur);cur={title,titleIds:[t.id],dates:[t.date],tasks:[t]};}
      }
    });
    if(cur)blocks.push(cur);
  });
  return blocks;
}

/* 为某个日期收集所有要显示的条目（来自各 block） */
function dayEntries(blocks,dateStr){
  const ents=[];
  blocks.forEach(b=>{
    const idx=b.dates.indexOf(dateStr);
    if(idx!==-1){
      const isStart=(idx===0),isEnd=(idx===b.dates.length-1),isSingle=(b.dates.length===1);
      const dayTask=b.tasks[idx];
      ents.push({title:b.title,blockLen:b.dates.length,idx,isSingle,isStart,isEnd,done:dayTask?dayTask.done:false,taskId:dayTask?dayTask.id:null,priority:dayTask?dayTask.priority:"normal",date:dateStr,ord:dayTask?state.tasks.indexOf(dayTask):-1});
    }
  });
  /* 排序：按重要程度 重要(high)→普通(normal)→稍后(low)，同级按添加先后(ord) */
  const PR={high:0,normal:1,low:2};
  ents.sort((a,b)=>{
    const ra=PR[a.priority]!==undefined?PR[a.priority]:1;
    const rb=PR[b.priority]!==undefined?PR[b.priority]:1;
    if(ra!==rb)return ra-rb;
    return a.ord-b.ord;
  });
  return ents;
}

/* 农历文本（依赖内联 solarLunar 库，1900-2100） */
function lunarText(y,m,d){
  try{
    const SL=(window.solarLunar&&window.solarLunar.default)?window.solarLunar.default:window.solarLunar;
    if(!SL||!SL.solar2lunar)return "";
    const r=SL.solar2lunar(y,m,d);
    /* 月份仅在农历每月初一显示（如六月初一），其余日子只显示日（如初二） */
    return r.lDay===1 ? SL.toChinaMonth(r.lMonth)+SL.toChinaDay(r.lDay) : SL.toChinaDay(r.lDay);
  }catch(e){return "";}
}
/* 判定某日期各专项group是否达标，返回达标的group集合 */
function getMetGroups(dateStr){
  const met=new Set();
  // 按 group 聚合
  const groups={};
  state.specialCats.forEach(c=>{
    const g=c.group||"_"+c.id; // 无独立group的用id作为key
    if(!groups[g])groups[g]={cats:[],groupName:g};
    groups[g].cats.push(c);
  });
  Object.keys(groups).forEach(gk=>{
    const grp=groups[gk];
    // 有group标记的：组内任一cat达标即算该组达标
    if(gk.startsWith("_")){
      // 独立项
      const c=grp.cats[0];
      if(c.target){
        const l=state.specialLogs.find(x=>x.catId===c.id&&x.date===dateStr);
        if(l&&l.value>=c.target)met.add(gk);
      }
    }else{
      // 有group的：任一子项达标
      const anyMet=grp.cats.some(c=>{
        if(!c.target)return false;
        const l=state.specialLogs.find(x=>x.catId===c.id&&x.date===dateStr);
        return l&&l.value>=c.target;
      });
      if(anyMet)met.add(gk);
    }
  });
  return met;
}
/* 日历专项达标图标HTML */
function calSpecIcons(dateStr){
  const met=getMetGroups(dateStr);
  if(!met.size)return "";
  let html='<div class="cal-spec-icons">';
  // 运动图标 (sport group)
  if(met.has("sport"))html+='<span class="csi csi-sport" title="运动达标">🏃</span>';
  // 阅读图标 (read group)
  if(met.has("read"))html+='<span class="csi csi-read" title="阅读达标">📖</span>';
  // 写作图标 (write group)
  if(met.has("write"))html+='<span class="csi csi-write" title="写作达标">✏️</span>';
  html+='</div>';
  return html;
}

      let pts="";

      svgInner+='<text x="'+px+'" y="'+(H-3)+'" class="lc-label">'+d.slice(5)+'</text>';

      '<svg viewBox="0 0 '+W+' '+H+'">'+svgInner+'</svg></div>'+
      '<div class="st-legend">'+legendHtml+'</div></div>';
  });
  // 本月累计 — 按group聚合，拆分显示各子项
  let streakHtml="";const ym=sd.slice(0,7);
  const groups=[...new Set(state.specialCats.map(c=>c.group).filter(Boolean))];
  (groups.length?groups:state.specialCats.map((_,i)=>i)).forEach(gk=>{
    const isGroupStr=typeof gk==="string";
    const catsInGroup=isGroupStr?state.specialCats.filter(c=>c.group===gk):[state.specialCats[gk]];
    if(!catsInGroup.length)return;
    const displayName=isGroupStr?catsInGroup[0].name.split("·")[0]:catsInGroup[0].name;
    const displayColor=catsInGroup[0].color;
    // 本月累计拆分各子项
    let monthParts="";
    catsInGroup.forEach(c=>{
      const subName=c.name.includes("·")?c.name.split("·")[1]:c.name;
      const mt=state.specialLogs.filter(x=>x.catId===c.id&&x.date.startsWith(ym)).reduce((s,x)=>s+x.value,0);
      monthParts+=esc(subName)+'<b>'+mt.toFixed(1)+'</b>'+esc(c.unit)+(catsInGroup.indexOf(c)<catsInGroup.length-1?'，':'');
    });
    // 本月达标次数（组内任一子项达标的天数）
    const year=parseInt(ym.slice(0,4),10);const month=parseInt(ym.slice(5,7),10);
    const dim=new Date(year,month,0).getDate();
    let metDays=0;
    for(let dy=1;dy<=dim;dy++){
      const ds=ym+"-"+String(dy).padStart(2,"0");
      const dayMet=catsInGroup.some(c=>{const val=specLogValue(c.id,ds);return c.target&&val!==""&&Number(val)>=c.target;});
      if(dayMet)metDays++;
    }
    streakHtml+='<div class="spec-stat-row"><span class="ss-name" style="display:flex;align-items:center;gap:4px"><span class="spec-dot" style="background:'+displayColor+'"></span>'+esc(displayName)+'</span>'+
      '<span class="ss-val ss-month">'+monthParts+'</span>'+
      '<span class="ss-val" style="flex:none;white-space:nowrap">达标 <b>'+metDays+'</b> 天</span></div>';
  });
  v.innerHTML=
    '<div class="add-card">'+
      firstRow+restRows+
      '<button class="btn primary" data-action="addSpec" style="margin-top:12px">保存记录</button>'+
    '</div>'+

    '<div class="card" id="specTrendCard"><h3>近 7 天趋势（虚线为达标值）</h3>'+trendHtml+'</div>'+
    '<div class="card"><h3>本月累计</h3>'+streakHtml+'</div>';
}

function addDaysStr(s,delta){const d=parseDate(s);d.setDate(d.getDate()+delta);return fmt(d);}
/* 复制任务到目标日期；若为连续任务（同标题且日期连续），整段平移复制，保持连续天数 */
function copyTaskTo(id,targetDate){
  const t=state.tasks.find(x=>x.id===id);if(!t||!targetDate)return 0;
  const sameTitle=state.tasks.filter(x=>x.title===t.title).sort((a,b)=>a.date.localeCompare(b.date));
  let run=[t];
  let d=t.date;
  while(true){const prev=addDaysStr(d,-1);const f=sameTitle.find(x=>x.date===prev);if(f){run.unshift(f);d=prev;}else break;}
  d=t.date;
  while(true){const nx=addDaysStr(d,1);const f=sameTitle.find(x=>x.date===nx);if(f){run.push(f);d=nx;}else break;}
  const start=run[0].date;const tgt=parseDate(targetDate);
  let n=0;
  run.forEach(x=>{
    const off=Math.round((parseDate(x.date)-parseDate(start))/86400000);
    const nd=new Date(tgt);nd.setDate(nd.getDate()+off);
    if(addTask(x.title,fmt(nd),x.category,x.priority,x.note))n++;
  });
  return n;
}

}

  if(e.target.id==="taskDate"){selDay=e.target.value||todayStr();renderTop();renderTodayList();
    // 起点变更时，若终点早于起点则自动夹紧
    const ep=document.getElementById("taskSpecDate");if(ep&&ep.value<e.target.value)ep.value=e.target.value;
    return;}
  if(e.target.id==="taskSpecDate"){

    const sp=document.getElementById("taskDate");

    selDay=e.target.value||todayStr();renderTop();renderTodayList();return;}
  if(e.target.classList.contains("preset-select")){
    // 常用任务下拉框选中 → 触发 pickPreset
    const val=e.target.value;if(!val)return;
    e.target.dataset.action="pickPreset";
    // 手动触发 click 逻辑
    const chipWrap=document.getElementById("pickedChips");
    if(chipWrap&&chipWrap.querySelector('.chip[data-val="'+esc(val)+'"]')){toast("已选过："+val);e.target.value="";return;}
    const chip=document.createElement("span");chip.className="chip sel";
    chip.dataset.val=val;chip.dataset.action="unpickPreset";chip.textContent=val;
    chipWrap.appendChild(chip);e.target.value="";
    toast("已选："+val);
    return;
  }
  if(e.target.id==="importFile"){importData(e.target.files[0]);e.target.value="";}
  if(e.target.id==="importExcelFile"){importExcelData(e.target.files[0]);e.target.value="";}
  /* 专项统计 */
  if(e.target.id==="specDate"){specDay=e.target.value||todayStr();renderSpecial();return;}
  if(e.target.classList.contains("spec-val")){
    const cat=e.target.dataset.cat;setSpecLog(cat,specDay,e.target.value);renderSpecial();return;
  }
  if(e.target.classList.contains("sm-name")||e.target.classList.contains("sm-unit")||e.target.classList.contains("sm-color")){
    const cid=e.target.dataset.id;const c=state.specialCats.find(c=>c.id===cid);if(c){
      if(e.target.classList.contains("sm-name"))c.name=e.target.value.trim()||c.name;
      else if(e.target.classList.contains("sm-unit"))c.unit=e.target.value.trim()||c.unit;
      else if(e.target.classList.contains("sm-color"))c.color=e.target.value;
      save();renderSpecial();
    }
    return;
  }
});

function xmlEsc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));}
// CRC32
const _crcTable=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=_crcTable[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  // files: [{name, data:Uint8Array}] -> Uint8Array (ZIP, 仅存储不压缩)
  const enc=new TextEncoder();const chunks=[];const central=[];let offset=0;
  const u16=v=>[v&0xFF,(v>>>8)&0xFF];const u32=v=>[v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF];
  files.forEach(f=>{
    const nameB=enc.encode(f.name);const data=f.data;const crc=crc32(data);
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0));
    chunks.push(new Uint8Array(local),nameB,data);
    central.push({crc,size:data.length,nameB,offset});
    offset+=local.length+nameB.length+data.length;
  });
  const cenChunks=[];let cenSize=0;const cenStart=offset;
  central.forEach(c=>{
    const rec=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(c.crc),u32(c.size),u32(c.size),u16(c.nameB.length),u16(0),u16(0),u16(0),u16(0),
      u32(0),u32(c.offset));
    const b=new Uint8Array(rec.length+c.nameB.length);b.set(rec,0);b.set(c.nameB,rec.length);
    cenChunks.push(b);cenSize+=b.length;
  });
  const end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),
    u16(central.length),u16(central.length),u32(cenSize),u32(cenStart),u16(0)));
  const all=[...chunks,...cenChunks,end];
  let tot=0;all.forEach(a=>tot+=a.length);
  const out=new Uint8Array(tot);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});
  return out;
}
function colLetter(n){let s="";n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}

function loadSyncCfg(){try{const r=localStorage.getItem(SYNC_KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==="object")syncCfg=Object.assign(syncCfg,o);}}catch(e){}}

function sha256Hex(str){
  if(!(window.crypto&&window.crypto.subtle))return Promise.reject(new Error("当前环境不支持加密（需用 https 打开）"));
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(str))
    .then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""));
}
let _supaLoading=null;
function ensureSupa(){
  if(supa)return Promise.resolve(supa);
  if(_supaLoading)return _supaLoading;
  if(!syncCfg.url||!syncCfg.anonKey)return Promise.reject(new Error("未配置 Supabase"));
  _supaLoading=new Promise((resolve,reject)=>{
    const done=()=>{try{supa=window.supabase.createClient(syncCfg.url,syncCfg.anonKey);resolve(supa);}catch(e){reject(e);}};
    if(window.supabase&&window.supabase.createClient){done();return;}
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload=done;
    s.onerror=()=>reject(new Error("同步库加载失败（请检查网络）"));
    document.head.appendChild(s);
  });
  return _supaLoading;
}

async function doUpload(){
  await ensureSupa();

  const {error}=await supa.from("synced_data").upsert({group_key:gk,payload:state,updated_at:new Date().toISOString()});
  if(error)throw error;
  syncCfg.lastSync=Date.now();persistSyncCfg();updateSyncStatus();
}
async function doDownload(){
  await ensureSupa();
  const gk=await sha256Hex(syncCfg.pass);
  const {data,error}=await supa.from("synced_data").select("payload,updated_at").eq("group_key",gk).maybeSingle();
  if(error)throw error;
  if(data&&data.payload){
    const remote=data.payload;
    state=Object.assign({tasks:[],categories:DEFAULT_CATEGORIES.slice(),presetCats:DEFAULT_PRESET_CATEGORIES.map(c=>({name:c.name,items:c.items.slice()})),presetVer:PRESETS_VERSION,

/* ---------- Excel 导入 ---------- */
function ensureXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload=()=>window.XLSX?resolve(window.XLSX):reject(new Error("XLSX 未就绪"));
    s.onerror=()=>reject(new Error("Excel 解析库加载失败（请检查网络）"));
    document.head.appendChild(s);
  });
}
function mapPri(s){s=String(s||"").trim();if(s.includes("重要")||s==="高"||s.toLowerCase()==="high")return "high";if(s.includes("稍后")||s==="低"||s.toLowerCase()==="low")return "low";return "normal";}
function normDate(s){
  if(s instanceof Date)return fmt(s);
  s=String(s||"").trim();
  const m=s.match(/(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
  if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
  const d=new Date(s);if(!isNaN(d))return fmt(d);
  return "";
}
function normDateObj(v){
  if(v instanceof Date)return v.getTime();
  if(typeof v==="string"&&v.trim()){const d=new Date(v);if(!isNaN(d))return d.getTime();}
  if(typeof v==="number"){const d=new Date((v-25569)*86400000);if(!isNaN(d))return d.getTime();}
  return null;
}
async function importExcelData(file){
  if(!file)return;
  toast("解析 Excel 中…");
  try{
    await ensureXLSX();
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(new Uint8Array(buf),{type:"array",cellDates:true});
    const sheet=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
    if(!rows||rows.length<2){toast("Excel 没有可导入的数据行");return;}
    const head=rows[0].map(c=>String(c).trim());
    const find=kw=>head.findIndex(h=>h.includes(kw));
    const iDate=find("日期"),iTitle=find("任务内容")>=0?find("任务内容"):find("任务"),
      iPri=find("优先级"),iStatus=find("状态"),iDone=find("完成时间"),iNote=find("备注"),
      iPeriod=find("任务时段"),iArrange=find("任务安排"),iPlace=find("任务地点");
    if(iTitle<0){toast("Excel 缺少「任务内容」列");return;}
    let added=0,updated=0;
    for(let r=1;r<rows.length;r++){
      const row=rows[r];
      const title=String(row[iTitle]??"").trim();
      const date=normDate(row[iDate]);
      if(!title||!date)continue;
      const pri=mapPri(row[iPri]);
      const status=String(row[iStatus]??"");
      const done=status==="已完成"||status.trim()==="完成"||status.includes("✓")||status==="1"||status.toLowerCase()==="done"||status.trim().toLowerCase()==="true";
      const note=String(row[iNote]??"").trim();
      const period=iPeriod>=0?String(row[iPeriod]??"").trim():"";
      const arrange=iArrange>=0?String(row[iArrange]??"").trim():"";
      const place=iPlace>=0?String(row[iPlace]??"").trim():"";
      let doneAt=null;
      if(done){const t=normDateObj(row[iDone]);if(t)doneAt=t;}
      const ex=state.tasks.find(t=>t.date===date&&t.title.trim().toLowerCase()===title.toLowerCase());
      if(ex){ex.priority=pri;ex.note=note;ex.period=period;ex.arrange=arrange;ex.place=place;ex.done=done;ex.doneAt=done?doneAt:null;updated++;}
      else{state.tasks.push({id:uid(),title,date,category:state.categories[0]?state.categories[0].name:"其他",priority:pri,note,period,arrange,place,done,doneAt,createdAt:Date.now()});added++;}
    }
    save();refreshCurrent();
    toast("导入完成：新增 "+added+" 条，更新 "+updated+" 条");
  }catch(e){toast("导入失败："+(e&&e.message?e.message:e));}
}

/* ---------- 日历滑动切换月份（在日期上按住后左右滑动） ---------- */
let calSwiped=false;
function changeMonth(delta){
  if(calYear===undefined){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();}
  calMonth+=delta;
  if(calMonth<0){calMonth+=12;calYear--;}
  else if(calMonth>11){calMonth-=12;calYear++;}
  renderCalendar();
}
function initCalSwipe(){
  const v=document.getElementById("view-calendar");
  if(!v||v._swipeReady)return; v._swipeReady=true;
  let sx=0,sy=0,fired=false,active=false;
  v.addEventListener("touchstart",e=>{
    const cell=e.target.closest(".cal-cell");
    if(!cell){active=false;return;}
    active=true;fired=false;
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;
  },{passive:true});
  v.addEventListener("touchmove",e=>{
    if(!active||fired)return;
    const t=e.touches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.4){
      fired=true;
      calSwiped=true;                         // 防止滑动后误触打开当日面板
      setTimeout(()=>{calSwiped=false;},450);
      if(dx<0)changeMonth(1); else changeMonth(-1); // 左滑→下一月，右滑→上一月
      if(e.cancelable)e.preventDefault();
    }
  },{passive:false});
  v.addEventListener("touchend",()=>{active=false;},{passive:true});
  v.addEventListener("touchcancel",()=>{active=false;},{passive:true});
}

/* ---------- 指尖滑动切换 Tab ---------- */
function initViewSwipe(){
  const order=["today","calendar","special","stats","settings"];
  let sx=0,sy=0,st=null;
  document.addEventListener("touchstart",e=>{
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=e.target;
  },{passive:true});
  document.addEventListener("touchend",e=>{
    if(!st)return;
    // 日历日格内由 initCalSwipe 处理切月；弹层内不切换
    if(st.closest(".cal-cell")||st.closest(".overlay"))return;
    const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.5){
      const cur=document.querySelector("nav.tabbar button.active");
      let i=cur?order.indexOf(cur.dataset.view):0;
      if(i<0)i=0;
      let ni = dx<0 ? i+1 : i-1;        // 左滑→下一标签，右滑→上一标签
      ni=Math.max(0,Math.min(order.length-1,ni));
      if(ni!==i)switchView(order[ni]);
    }
  },{passive:true});
}

/* ---------- 访问口令（客户端防护，非真加密） ---------- */
const PW_KEY="tasktracker_pw";
let sessionPw=null; // 本次会话内存中保留的明文口令（仅用于生成二维码，不持久化）
function sha256hex(str){
  function rotr(x,n){return (x>>>n)|(x<<(32-n));}
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const msgUtf8=unescape(encodeURIComponent(str));
  const l=msgUtf8.length, bitLen=l*8, total=(((l+1+8+63)>>6)<<6);
  const bytes=new Array(total);
  for(let i=0;i<l;i++)bytes[i]=msgUtf8.charCodeAt(i);
  bytes[l]=0x80;
  for(let i=l+1;i<total;i++)bytes[i]=0;
  bytes[total-4]=(bitLen>>>24)&0xff;bytes[total-3]=(bitLen>>>16)&0xff;bytes[total-2]=(bitLen>>>8)&0xff;bytes[total-1]=bitLen&0xff;
  for(let off=0;off<total;off+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++){const j=off+i*4;w[i]=(bytes[j]<<24)|(bytes[j+1]<<16)|(bytes[j+2]<<8)|bytes[j+3];}
    for(let i=16;i<64;i++){const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);const ch=(e&f)^((~e)&g);const t1=(h+S1+ch+K[i]+w[i])|0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>((x>>>0).toString(16).padStart(8,"0"))).join("");
}

  ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#0f172a";

    '<div class="qr-title">生成登录二维码</div>'+
    '<div class="tip">请输入当前口令以生成分享二维码（核验你确实拥有访问权）。</div>'+
    '<input type="password" id="qrGenInput" class="lock-input" placeholder="当前口令">'+
    '<button class="btn primary" data-action="genQrConfirm">生成</button>'+
    '<div class="lock-err" id="qrGenErr"></div></div>';
  m.classList.remove("hidden");
  const inp=document.getElementById("qrGenInput");inp.focus();
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=document.querySelector('#qrGenModal [data-action="genQrConfirm"]');if(b)b.click();}});
}
function genQrConfirm(){
  const val=document.getElementById("qrGenInput").value||"";
  if(sha256hex(val)!==getPwHash()){const e=document.getElementById("qrGenErr");if(e)e.textContent="口令错误";return;}
  document.getElementById("qrGenModal").classList.add("hidden");
  openQr(val);
}

/* ---------- 启动 ---------- */
load();
document.body.classList.toggle("fast", state.fastTap!==false);
loadSyncCfg();
(async function boot(){
  if(syncCfg.auto&&syncCfg.url&&syncCfg.anonKey&&syncCfg.pass){
    try{await doDownload();}catch(e){}
  }
  let unlocked=false;
  try{unlocked=sessionStorage.getItem("tt_unlocked")==="1";}catch(e){}
  if(getPwHash() && !unlocked){
    showLock();
  }else{
    startApp();
  }
})();
if("serviceWorker" in navigator){
  const SW_VER="20"; // 与 sw.js 中 CACHE 版本保持一致；每次更新需同步递增
  let _swRefreshing=false;
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js?_="+SW_VER).then(reg=>{
      // 切回前台 / 每 60s 主动检查更新（绕过微信 HTTP 层缓存）
      document.addEventListener("visibilitychange",()=>{if(!document.hidden){try{reg.update();}catch(e){}}});
      setInterval(()=>{try{reg.update();}catch(e){}},60000);
    }).catch(()=>{});
  });
  // 新 Service Worker 接管后自动重载页面，使新版本立即生效（无需重新添加到主屏幕）
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(_swRefreshing)return;_swRefreshing=true;window.location.reload();
  });
}
</script>
